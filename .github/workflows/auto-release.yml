name: Auto tag and release

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Create or reuse the next patch tag
        id: tag
        shell: bash
        env:
          INITIAL_VERSION: "0.1.0"
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in {1..10}; do
            git fetch --force --tags origin

            existing_tag="$(
              git tag --points-at "${TARGET_SHA}" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
            if [[ -n "${existing_tag}" ]]; then
              echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            next_tag="$(
              python - <<'PY'
          import os
          import re
          import subprocess

          pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          versions = []
          for tag in subprocess.check_output(
              ["git", "tag", "--list"], text=True
          ).splitlines():
              match = pattern.fullmatch(tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if versions:
              major, minor, patch = max(versions)
              patch += 1
          else:
              initial = os.environ["INITIAL_VERSION"]
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", initial)
              if not match:
                  raise SystemExit(f"Invalid INITIAL_VERSION: {initial}")
              major, minor, patch = map(int, match.groups())

          print(f"v{major}.{minor}.{patch}")
          PY
            )"

            git tag -a "${next_tag}" "${TARGET_SHA}" -m "Release ${next_tag}"
            if git push origin "refs/tags/${next_tag}"; then
              echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git tag --delete "${next_tag}"
            sleep "${attempt}"
          done

          echo "Could not allocate a unique release tag after 10 attempts." >&2
          exit 1

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          if ! gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --generate-notes; then
            gh release view "${RELEASE_TAG}" >/dev/null
          fi

      - name: Start versioned container image workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run reminder-deploy.yml --ref "${RELEASE_TAG}"
